name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Encoded images are content-addressed (file names hash the source bytes
      # and encoder settings), so a restored cache only skips work: the script
      # re-encodes anything missing and prunes anything stale.
      - name: Cache optimized images
        uses: actions/cache@v5
        with:
          path: site/public/media
          key: media-${{ runner.os }}-${{ hashFiles('site/media-sources.json', 'site/scripts/optimize-images.mjs') }}
          restore-keys: media-${{ runner.os }}-

      # The Transient zip is committed (assets/ or archive/transient/); prebuild
      # extracts it. Run it explicitly so a missing zip fails with a clear step.
      - name: Prepare Transient
        run: node scripts/prepare-transient.mjs

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Real-browser axe audit of every route (light/dark, desktop/mobile,
      # forced colors) against the static export. Fails on any violation.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility audit
        run: npm run a11y
      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: site/.a11y/report.json
